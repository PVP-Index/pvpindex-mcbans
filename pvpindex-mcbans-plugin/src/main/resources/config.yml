#########################################################
# PvPIndex MCBans Configuration
# Plugin version 1.0.0
# - Platform: https://pvpindex.com
# - API:      https://api.pvpindex.com
##

# Internal config version - do not edit.
ConfigVersion: 3

# prefix:
#   Prefix for MCBans messages shown to players.
# DEFAULT: "&c[PvPIndex MCBans] &r"
prefix: "&c[PvPIndex MCBans] &r"

#########################################################
# PvPIndex API
#   Credentials and sync settings for the PvPIndex REST API.
##

pvpindex:
  # apiUrl: Base URL of the PvPIndex API.
  #   DEFAULT: "https://api.pvpindex.com"
  apiUrl: "https://api.pvpindex.com"

  # apiKey: Your server's Bearer token from the PvPIndex dashboard.
  #   Required for ban sync. Obtain one at https://pvpindex.com/servers
  apiKey: ""

  # syncInterval: How often (in minutes) to sync bans with the API.
  #   DEFAULT: 60
  syncInterval: 60

#########################################################
# Local Storage
#   Controls how bans are stored locally on the server.
##

storage:
  # backend: Storage engine for local ban data.
  #   Supported values: sqlite (default), yaml, mysql, postgresql
  backend: sqlite

  # sync.enabled: Whether to sync bans with the PvPIndex API.
  #   Set to false to run entirely offline (local bans only).
  #   DEFAULT: true
  sync:
    enabled: true

  # MySQL / MariaDB settings (only used when backend: mysql)
  mysql:
    host: localhost
    port: 3306
    database: mcbans
    username: mcbans
    password: ""
    pool-size: 5
    useSSL: false

  # PostgreSQL settings (only used when backend: postgresql)
  postgresql:
    host: localhost
    port: 5432
    database: mcbans
    username: mcbans
    password: ""
    pool-size: 5

#########################################################
# Localisation
##

# language: Language file to load from plugins/MCBans/languages/
#   DEFAULT: default
language: default

#########################################################
# Permissions
##

# permission: Permission backend - Vault, SuperPerms, OPs
#   DEFAULT: SuperPerms
permission: SuperPerms

#########################################################
# Default Messages
##

defaultLocal: "You have been banned!"
defaultTemp:  "You have been temporarily banned!"
defaultKick:  "You have been kicked!"

#########################################################
# Logging & Debug
##

# isDebug: Print verbose debug output to console.
#   DEFAULT: false
isDebug: false

# logEnable: Write ban actions to a local log file.
#   DEFAULT: false
logEnable: false

# logFile: Path to the log file.
#   DEFAULT: plugins/MCBans/actions.log
logFile: "plugins/MCBans/actions.log"

#########################################################
# Miscellaneous
##

# failsafe: Deny login if the API is unreachable AND no local ban record exists.
#   Set to true for maximum security (may cause false kicks during API outages).
#   DEFAULT: false
failsafe: false

#########################################################
# Kick Messages
#   Templates shown to banned players when they try to join.
#   Placeholders: {reason}, {admin}, {expires}, {appeal_url}
#   Use & colour codes (e.g. &c for red, &f for white, \n for new line).
##

kick-message:
  # Shown for permanent global bans.
  global: "&cYou are &lbanned&r&c from this server.\n&fReason: &7{reason}\n&fBanned by: &7{admin}"
  # Shown for local (server-only) bans.
  local: "&cYou are &llocally banned&r&c from this server.\n&fReason: &7{reason}\n&fBanned by: &7{admin}"
  # Shown for temporary bans.
  temp: "&cYou are &ltemporarily banned&r&c from this server.\n&fReason: &7{reason}\n&fBanned by: &7{admin}\n&fExpires: &7{expires}"
  # Shown when failsafe=true and the API is unreachable.
  failsafe: "&c[PvPIndex MCBans] &rUnable to verify your ban status. Please try again shortly."
  # If set, appended to every kick message as "&fAppeal at: &b<url>"
  appeal-url: ""

#########################################################
# Reason Presets
#   Expand #key in ban commands to a full reason string.
#   Usage: /ban <player> #hacks
#          /gban <player> #hacks
#          /tban <player> #chat-abuse   (uses default-duration if set)
#          /tban <player> 7d #hacks     (duration overrides preset default)
#
#   Simple form:  key: "Reason text"
#   Extended form with default temp-ban duration:
#     key:
#       reason: "Reason text"
#       default-duration: "7d"   # supports s/m/h/d/w suffixes
##

reason-presets:
  hacks: "Hacking - unfair advantage detected"
  grief: "Griefing server property"
  chat-abuse:
    reason: "Chat abuse / spam"
    default-duration: "1d"
  hack-first:
    reason: "Hacking - first offence"
    default-duration: "7d"
